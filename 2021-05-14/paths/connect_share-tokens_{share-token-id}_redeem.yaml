post:
  tags:
    - Connect
  summary: Redeem a Share Token
  description: >
    Initiates redemption of a Share Token in one of two modes:


    - **Clone:** Omit `data.attributes.destination-id` to create a new object
    from the source.
      Inquiry and Verification Share Tokens can be cloned.
    - **Hydrate:** Provide `data.attributes.destination-id` to import source
    data into an existing
      object. Account, Transaction, and Inquiry Share Tokens can hydrate an existing Account,
      Transaction, or Inquiry.

    Redemption is asynchronous. A successful request returns the Share Token
    with a `pending`

    status while Persona processes the import.
  operationId: redeem-share-token
  x-persona-product: Connect
  x-fern-examples:
    - name: Clone an object
      path-parameters:
        share-token-id: cnst_ABC123
      request:
        data:
          attributes: {}
      response:
        body:
          data:
            type: connect/share-token
            id: cnst_ABC123
            attributes:
              status: pending
              direction: inbound
              created-at: '2023-08-17T23:18:13.000Z'
              updated-at: '2023-08-17T23:25:00.000Z'
              pending-at: '2023-08-17T23:25:00.000Z'
              redeemed-at: null
              expires-at: null
              failed-at: null
              failure-reason: null
              redeem-mode: clone
            relationships:
              destination:
                data: null
              connection:
                data:
                  type: connect/connection
                  id: cxn_ABC123
    - name: Hydrate an object
      path-parameters:
        share-token-id: cnst_DEF456
      request:
        data:
          attributes:
            destination-id: inq_XYZ789
      response:
        body:
          data:
            type: connect/share-token
            id: cnst_DEF456
            attributes:
              status: pending
              direction: inbound
              created-at: '2023-08-17T23:18:13.000Z'
              updated-at: '2023-08-17T23:25:00.000Z'
              pending-at: '2023-08-17T23:25:00.000Z'
              redeemed-at: null
              expires-at: null
              failed-at: null
              failure-reason: null
              redeem-mode: hydrate
            relationships:
              destination:
                data:
                  type: inquiry
                  id: inq_XYZ789
              connection:
                data:
                  type: connect/connection
                  id: cxn_ABC123
  parameters:
    - in: path
      name: share-token-id
      required: true
      schema:
        type: string
      description: The token/ID of the Share Token to be redeemed.
    - $ref: ../components/parameters/key-inflection-header.yaml
    - $ref: ../components/parameters/idempotency-key-header.yaml
    - $ref: ../components/parameters/persona-version-header.yaml
    - $ref: ../components/parameters/include-query-parameter.yaml
    - $ref: ../components/parameters/fields-query-parameter.yaml
  requestBody:
    required: false
    content:
      application/json:
        examples:
          CloneObject:
            x-remove-from-fern: true
            $ref: ../components/examples/redeem-share-token-clone-object.yaml
          HydrateObject:
            x-remove-from-fern: true
            $ref: ../components/examples/redeem-share-token-hydrate-object.yaml
        schema:
          type: object
          additionalProperties: false
          properties:
            data:
              type: object
              additionalProperties: false
              properties:
                attributes:
                  type: object
                  additionalProperties: false
                  properties:
                    destination-id:
                      type: string
                      description: >
                        The ID of the existing destination object to hydrate.
                        Omit this field, or

                        the entire request body, to clone the source into a new
                        destination object.
                      example: inq_DEF456
            meta:
              type: object
              additionalProperties: false
              properties:
                field-mappings:
                  type: array
                  description: >
                    Optional list of field mappings to apply when hydrating an
                    existing destination.

                    If a source field name matches the destination field name,
                    it is copied directly.

                    These mappings are applied for fields not already matched by
                    name. Field mappings

                    are not used when cloning; omit them from clone requests.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - source-field-name
                      - destination-field-name
                    properties:
                      source-field-name:
                        type: string
                        description: The name of the field in the source object.
                        example: address_street_1
                      destination-field-name:
                        type: string
                        description: The name of the field in the destination object.
                        example: street_address
  responses:
    '202':
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/rate-limit-limit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/rate-limit-remaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/rate-limit-reset.yaml
        Request-Id:
          $ref: ../components/headers/request-id.yaml
        Persona-Environment-Id:
          $ref: ../components/headers/persona-environment-id.yaml
        Persona-Organization-Id:
          $ref: ../components/headers/persona-organization-id.yaml
      description: Share Token redemption has been initiated and is processing.
      content:
        application/json:
          examples:
            CloneObject:
              x-remove-from-fern: true
              $ref: >-
                ../components/examples/connect-share-token-clone-object-pending.yaml
            HydrateObject:
              x-remove-from-fern: true
              $ref: >-
                ../components/examples/connect-share-token-hydrate-object-pending.yaml
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                $ref: ../components/schemas/connect-share-token.yaml
              included:
                $ref: ../components/schemas/empty-included-objects.yaml
            required:
              - data
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '409':
      $ref: ../components/responses/conflict.yaml
    '422':
      $ref: ../components/responses/unprocessable-entity.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
