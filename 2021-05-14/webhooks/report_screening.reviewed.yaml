post:
  operationId: webhook-report-screening-reviewed
  summary: Screening report record reviewed
  description: >-
    Webhook for the `report/screening.reviewed` event. For more info see
    [Webhooks Overview](https://docs.withpersona.com/webhooks).


    Sent when a matched record on a screening report is reviewed (e.g. confirmed
    or dismissed) by a reviewer.


    The payload is the polymorphic report object. Inspect `payload.data.type`
    (`report/screening`) to identify the report, and
    `payload.data.attributes.matched-records[].review-status` for the reviewed
    record's outcome.
  tags:
    - Report events
  x-persona-product: Reports
  parameters:
    - $ref: ../components/parameters/persona-signature-header.yaml
    - $ref: ../components/parameters/persona-webhook-attempts-made.yaml
    - $ref: ../components/parameters/persona-webhook-attempts-left.yaml
    - $ref: ../components/parameters/persona-webhook-first-attempted-at.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            data:
              type: object
              unevaluatedProperties: false
              allOf:
                - $ref: ../components/schemas/webhook-body-shared-data.yaml
                - type: object
                  properties:
                    attributes:
                      unevaluatedProperties: false
                      allOf:
                        - type: object
                          properties:
                            name:
                              type: string
                              const: report/screening.reviewed
                            context:
                              type: object
                              additionalProperties: false
                              description: >-
                                Identifies the disposition applied and the
                                reviewer's comment.
                              properties:
                                review-type:
                                  type:
                                    - string
                                    - 'null'
                                  description: >-
                                    The scope of the review action.


                                    Possible values:

                                    - all_records

                                    - attribute

                                    - multiple_attributes

                                    - record


                                    Do not assume this is a static enumeration;
                                    Persona may add new

                                    values in the future without a versioned
                                    update.
                                  examples:
                                    - record
                                review-status:
                                  type:
                                    - string
                                    - 'null'
                                  description: >-
                                    Possible values:

                                    - pending

                                    - indeterminate

                                    - true_positive

                                    - false_positive


                                    Do not assume this is a static enumeration;
                                    Persona may add new

                                    values in the future without a versioned
                                    update.
                                  examples:
                                    - false_positive
                                risk-level:
                                  type:
                                    - string
                                    - 'null'
                                  description: >-
                                    Possible values:

                                    - material

                                    - immaterial


                                    Do not assume this is a static enumeration;
                                    Persona may add new

                                    values in the future without a versioned
                                    update.
                                  examples:
                                    - material
                                record-token:
                                  type:
                                    - string
                                    - 'null'
                                  description: >-
                                    The token of the matched record this review
                                    applies to. Absent when the review applied
                                    to the whole report rather than a single
                                    record (`review-type` `all_records`,
                                    `attribute`, or `multiple_attributes`).
                                  examples:
                                    - scrre_3EenGd9ZzeXLWBL11K5mnSBi
                                comment:
                                  type:
                                    - string
                                    - 'null'
                                  description: >-
                                    The reviewer's free-text comment explaining
                                    the disposition, if one was provided.
                            payload:
                              type: object
                              additionalProperties: false
                              properties:
                                data:
                                  $ref: ../components/schemas/report-screening.yaml
                                included:
                                  description: >-
                                    Objects referenced by
                                    `payload.data.relationships` are included
                                    here when related-object inclusion is
                                    enabled for the webhook. When inclusion is
                                    off (the default), the `included` key is
                                    omitted entirely (it is not returned as an
                                    empty array).
                                  $ref: >-
                                    ../components/schemas/reports-included-objects.yaml
                        - $ref: >-
                            ../components/schemas/webhook-body-shared-attributes.yaml
        examples:
          Example Body:
            $ref: ../components/examples/report-screening-reviewed-webhook-body.yaml
  responses:
    '200':
      $ref: ../components/responses/success.yaml
