title: Screening Report
description: Fields required to create a Screening Report
type: object
additionalProperties: false
properties:
  type:
    type: string
    const: report/screening
  attributes:
    unevaluatedProperties: false
    allOf:
      - $ref: ./report-shared-request-attributes.yaml
      - type: object
        properties:
          query:
            type: object
            additionalProperties: false
            description: >-
              At least one of `name-first`, `name-middle`, `name-last`, `term`,
              `birthdate`, `address-street-1`, `address-street-2`,
              `address-city`, `address-subdivision`, `address-postal-code`,
              `address-country-code`, `email`, or `identification-number` is
              required.
            properties:
              name-first:
                type:
                  - string
                  - 'null'
                description: The first name of the individual to search.
                example: Joe
              name-middle:
                type:
                  - string
                  - 'null'
                description: The middle name of the individual to search.
                example: 'N'
              name-last:
                type:
                  - string
                  - 'null'
                description: The last name of the individual to search.
                example: Doe
              term:
                type:
                  - string
                  - 'null'
                description: >-
                  Custom search term instead of separate name parts of the
                  individual (i.e. first + middle + last name). Must contain at
                  least one letter.
                example: Joe N Doe
              birthdate:
                type:
                  - string
                  - 'null'
                description: >-
                  The birthdate of the individual, formatted as YYYY-MM-DD (ISO
                  8601).
                example: '1991-10-07'
              address-street-1:
                type:
                  - string
                  - 'null'
                description: The first line of the address to search.
                example: 1 Persona Way
              address-street-2:
                type:
                  - string
                  - 'null'
                description: The second line of the address to search.
                example: Suite 100
              address-city:
                type:
                  - string
                  - 'null'
                description: The city of the address to search.
                example: San Francisco
              address-subdivision:
                type:
                  - string
                  - 'null'
                description: The state or subdivision of the address to search.
                example: CA
              address-postal-code:
                type:
                  - string
                  - 'null'
                description: The postal code of the address to search.
                example: '94103'
              address-country-code:
                type:
                  - string
                  - 'null'
                description: ISO 3166-1 alpha-2 country code of the address to search.
                example: US
              email:
                type:
                  - string
                  - 'null'
                description: The email address of the individual to search.
                example: joe.doe@example.com
              identification-number:
                type:
                  - string
                  - 'null'
                description: The government ID number of the individual to search.
                example: '123456789'
        required:
          - query
required:
  - attributes
