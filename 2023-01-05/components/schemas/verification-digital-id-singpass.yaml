title: Digital ID Singpass Verification
description: A Digital ID Singpass Verification
type: object
additionalProperties: false
properties:
  type:
    type: string
    const: verification/digital-id-singpass
  id:
    type: string
    description: The token of the verification
    example: ver_ABC123
  attributes:
    unevaluatedProperties: false
    allOf:
      - $ref: ./verification-shared-attributes.yaml
      - type: object
        properties:
          identity-number:
            type:
              - string
              - 'null'
          identity-coi:
            description: Country of issue for the identity document.
            type:
              - string
              - 'null'
          name:
            type:
              - string
              - 'null'
          alias-name:
            type:
              - string
              - 'null'
          hanyu-pinyin-name:
            type:
              - string
              - 'null'
          hanyu-pinyin-alias-name:
            type:
              - string
              - 'null'
          married-name:
            type:
              - string
              - 'null'
          birthdate:
            type:
              - string
              - 'null'
            format: date
          sex:
            type:
              - string
              - 'null'
          race:
            type:
              - string
              - 'null'
          secondary-race:
            type:
              - string
              - 'null'
          nationality:
            type:
              - string
              - 'null'
          nationality-description:
            description: >-
              The individual's nationality as described by Singpass. Singpass
              codes follow ICA's legacy list rather than ISO 3166-1, so this
              description is the only reliable source for the readable value.
            type:
              - string
              - 'null'
            examples:
              - SINGAPORE CITIZEN
          birth-country:
            type:
              - string
              - 'null'
          birth-country-description:
            description: >-
              The name of the individual's country of birth as described by
              Singpass. Singpass codes follow ICA's legacy list rather than ISO
              3166-1, so this description is the only reliable source for the
              country name.
            type:
              - string
              - 'null'
            examples:
              - SINGAPORE
          residential-status:
            type:
              - string
              - 'null'
          pass-type:
            description: Pass type for foreign residents.
            type:
              - string
              - 'null'
          pass-status:
            type:
              - string
              - 'null'
          pass-expiry-date:
            type:
              - string
              - 'null'
            format: date
          address-street-1:
            type:
              - string
              - 'null'
          address-street-2:
            type:
              - string
              - 'null'
          address-postal-code:
            type:
              - string
              - 'null'
          address-country-code:
            type:
              - string
              - 'null'
          address-country-description:
            description: >-
              The country name of the individual's registered address as
              described by Singpass. Singpass codes follow ICA's legacy list
              rather than ISO 3166-1, so this description is the only reliable
              source for the country name.
            type:
              - string
              - 'null'
            examples:
              - SINGAPORE
          employer-name:
            description: >-
              The name of the employer, as registered with Singpass. Only
              available for foreigners (FIN holders).
            type:
              - string
              - 'null'
          employment-sector:
            description: >-
              The sector of the work pass, such as MANUFACTURING, CONSTRUCTION
              or SERVICE. Only available for foreigners with a valid work pass.
            type:
              - string
              - 'null'
          notice-of-assessment-amount-sgd:
            description: >-
              The total income amount, in Singapore dollars, on the latest
              Notice of Assessment. Null when there is no assessment in the last
              2 years.
            type:
              - number
              - 'null'
          notice-of-assessment-year:
            description: The year of assessment (YYYY) of the latest Notice of Assessment.
            type:
              - string
              - 'null'
          notice-of-assessment-category:
            description: >-
              The category of the Notice of Assessment (ORIGINAL, AMENDED,
              ADDITIONAL or REPAYMENT).
            type:
              - string
              - 'null'
          notice-of-assessment-employment-income-sgd:
            description: >-
              The employment income, in Singapore dollars, on the Notice of
              Assessment.
            type:
              - number
              - 'null'
          notice-of-assessment-trade-income-sgd:
            description: >-
              The trade income, in Singapore dollars, on the Notice of
              Assessment.
            type:
              - number
              - 'null'
          notice-of-assessment-rent-income-sgd:
            description: >-
              The rental income, in Singapore dollars, on the Notice of
              Assessment.
            type:
              - number
              - 'null'
          notice-of-assessment-interest-income-sgd:
            description: >-
              The interest income, in Singapore dollars, on the Notice of
              Assessment.
            type:
              - number
              - 'null'
          notice-of-assessment-tax-clearance:
            description: >-
              Whether tax clearance applies to the Notice of Assessment (Y or
              N).
            type:
              - string
              - 'null'
  relationships:
    $ref: ./verification-shared-relationships.yaml
