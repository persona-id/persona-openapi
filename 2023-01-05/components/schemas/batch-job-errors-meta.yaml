type: object
additionalProperties: false
description: >-
  Error counts for a Batch Job, independent of which page of row errors was
  requested.
properties:
  error-count:
    type: integer
    description: >-
      Total number of rows that failed to process, across the whole run (not
      just this page).
    examples:
      - 2
  global-errors:
    type: array
    description: Errors that affected the whole run rather than a single row.
    items:
      type: object
      additionalProperties: false
      properties:
        error-type:
          type: string
          examples:
            - failed_to_write
        message:
          type:
            - string
            - 'null'
          examples:
            - Could not connect to the destination
        retryable:
          type: boolean
          examples:
            - false
