type: object
additionalProperties: false
description: >-
  One theme variant: `inquiry` holds flow chrome (navbar, modal, hosted flow),
  `components` holds the per-component style grid (component → variant → state →
  properties). Value leaves are typed objects such as `{ unit: hex, value:
  "#111111" }` (color), `{ unit: px, value: 16 }` (size), `{ x: ..., y: ... }`
  (dimensions) and `{ bitmask: 15 }` (corner mask). The accepted cells are
  exactly those of the Code-First theme-set YAML shape; a request containing a
  non-permitted or mistyped cell at any depth is rejected with a 400 naming each
  offending path. Values that pass the structural check but cannot be reconciled
  into the stored theme (for example, shared button properties that disagree
  between the primary and secondary variants) are rejected with a 422.
properties:
  inquiry:
    type: object
    additionalProperties: true
  components:
    type: object
    additionalProperties: true
  step-assets:
    type: object
    additionalProperties: true
