post:
  operationId: webhook-case-updated-tags
  summary: Case updated tags
  description: >-
    Webhook for the `case.updated-tags` event. The `context` identifies the tags
    added and removed by the update. For more info see [Webhooks
    Overview](https://docs.withpersona.com/webhooks).
  tags:
    - Case events
  x-persona-product: Cases
  parameters:
    - $ref: ../components/parameters/persona-signature-header.yaml
    - $ref: ../components/parameters/persona-webhook-attempts-made.yaml
    - $ref: ../components/parameters/persona-webhook-attempts-left.yaml
    - $ref: ../components/parameters/persona-webhook-first-attempted-at.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            data:
              type: object
              unevaluatedProperties: false
              allOf:
                - $ref: ../components/schemas/webhook-body-shared-data.yaml
                - type: object
                  properties:
                    attributes:
                      unevaluatedProperties: false
                      allOf:
                        - type: object
                          properties:
                            name:
                              type: string
                              const: case.updated-tags
                            context:
                              type: object
                              additionalProperties: false
                              description: >-
                                Identifies the tag names added to and removed
                                from the Case.
                              properties:
                                added-tags:
                                  type: array
                                  description: >-
                                    Names of tags added by this update. Empty if
                                    none were added.
                                  items:
                                    type: string
                                  examples:
                                    - - escalated
                                removed-tags:
                                  type: array
                                  description: >-
                                    Names of tags removed by this update. Empty
                                    if none were removed.
                                  items:
                                    type: string
                                  examples:
                                    - - standard-priority
                            payload:
                              type: object
                              additionalProperties: false
                              properties:
                                data:
                                  $ref: ../components/schemas/case.yaml
                                included:
                                  description: >-
                                    All objects that are present in
                                    `data.attributes.relationships` will be
                                    provided in `included`.
                                  $ref: >-
                                    ../components/schemas/cases-included-objects.yaml
                        - $ref: >-
                            ../components/schemas/webhook-body-shared-attributes.yaml
        examples:
          Example Body:
            $ref: ../components/examples/case-updated-tags-webhook-body.yaml
  responses:
    '200':
      $ref: ../components/responses/success.yaml
