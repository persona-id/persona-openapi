post:
  description: >-
    Removes Persona objects (such as inquiries or verifications) from a
    Transaction. This operation is idempotent — removing an object that is not
    attached succeeds without modifying the transaction. To unlink a Transaction
    from an Account or another Transaction, use remove-relation instead.
  operationId: transactions-remove-objects
  externalDocs:
    description: Full documentation for this API on the Persona website.
    url: >-
      https://docs.withpersona.com/api-reference/transactions/remove-persona-objects
  parameters:
    - $ref: ../components/parameters/key-inflection-header.yaml
    - $ref: ../components/parameters/idempotency-key-header.yaml
    - $ref: ../components/parameters/persona-version-header.yaml
    - $ref: ../components/parameters/include-query-parameter.yaml
    - $ref: ../components/parameters/fields-query-parameter.yaml
    - description: ID of the transaction to update
      in: path
      name: transaction-id
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          properties:
            meta:
              properties:
                object-ids:
                  description: >-
                    Array of Persona object IDs to detach from this transaction.
                    The following object types are supported- documents,
                    inquiries, reports, and verifications.
                  items:
                    type: string
                  type: array
                  maxItems: 100
              type: object
              additionalProperties: false
              required:
                - object-ids
          type: object
          additionalProperties: false
          required:
            - meta
        examples:
          Success:
            $ref: ../components/examples/remove-objects-2.yaml
  responses:
    '200':
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/rate-limit-limit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/rate-limit-remaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/rate-limit-reset.yaml
        Request-Id:
          $ref: ../components/headers/request-id.yaml
        Persona-Environment-Id:
          $ref: ../components/headers/persona-environment-id.yaml
        Persona-Organization-Id:
          $ref: ../components/headers/persona-organization-id.yaml
      content:
        application/json:
          examples:
            Success:
              $ref: ../components/examples/transaction.yaml
          schema:
            properties:
              data:
                $ref: ../components/schemas/transaction.yaml
              included:
                description: >-
                  Objects that _may_ be returned if specified via the `include`
                  query parameter in the request.
                $ref: ../components/schemas/transactions-included-objects.yaml
            type: object
            additionalProperties: false
            required:
              - data
      description: >-
        This endpoint returns a Transaction object and (optionally) its related
        objects in `included`.
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '409':
      $ref: ../components/responses/conflict.yaml
    '422':
      $ref: ../components/responses/unprocessable-entity.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
  summary: Remove Persona objects from a Transaction
  tags:
    - Transactions
  x-persona-product: Transactions
