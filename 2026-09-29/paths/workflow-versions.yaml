get:
  description: >-
    Retrieves the published versions and current draft version of a Workflow.
    Archived versions are not returned.


    Provide the Workflow ID in `filter[workflow-id]`, which you can copy from
    the Workflow in your Persona dashboard. The `live`, `rollout-label`, and
    `rollout-percentage` attributes are relative to the environment your API key
    belongs to: a version live in Production is not live in Sandbox. Sandbox API
    keys are supported, and report `live: false` for every version of a Workflow
    that is only deployed to Production.
  operationId: list-all-workflow-versions
  externalDocs:
    description: Full documentation for this API on the Persona website.
    url: >-
      https://docs.withpersona.com/api-reference/workflow-versions/list-all-workflow-versions
  parameters:
    - $ref: ../components/parameters/key-inflection-header.yaml
    - $ref: ../components/parameters/idempotency-key-header.yaml
    - $ref: ../components/parameters/persona-version-header.yaml
    - $ref: ../components/parameters/pagination-query-params.yaml
    - $ref: ../components/parameters/fields-query-parameter.yaml
    - in: query
      name: filter
      required: true
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: false
        required:
          - workflow-id
        properties:
          workflow-id:
            type: string
            description: The Workflow ID to list versions for.
            examples:
              - wfl_3VghhbvDc7UuUNT8uZrqZjsk
  responses:
    '200':
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/rate-limit-limit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/rate-limit-remaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/rate-limit-reset.yaml
        Request-Id:
          $ref: ../components/headers/request-id.yaml
        Persona-Environment-Id:
          $ref: ../components/headers/persona-environment-id.yaml
        Persona-Organization-Id:
          $ref: ../components/headers/persona-organization-id.yaml
      description: This endpoint returns a collection of Workflow Version objects.
      content:
        application/json:
          examples:
            Success:
              $ref: ../components/examples/workflow-version-list.yaml
          schema:
            type: object
            additionalProperties: false
            required:
              - data
              - links
            properties:
              data:
                type: array
                description: An array of Workflow Versions
                items:
                  $ref: ../components/schemas/workflow-version.yaml
              links:
                type: object
                additionalProperties: false
                required:
                  - prev
                  - next
                properties:
                  prev:
                    type:
                      - 'null'
                      - string
                  next:
                    type:
                      - 'null'
                      - string
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
  summary: List all Workflow Versions
  tags:
    - Workflows
  x-persona-product: Workflows
