get:
  summary: List all Theme Sets
  tags:
    - Theme Sets
  x-persona-product: Inquiries
  description: >-
    Returns a list of your organization's theme sets. Results are returned in
    reverse chronological order, with the most recently created objects first.
  operationId: list-all-theme-sets
  externalDocs:
    description: Full documentation for this API on the Persona website.
    url: https://docs.withpersona.com/api-reference/theme-sets/list-all-theme-sets
  parameters:
    - $ref: ../components/parameters/key-inflection-header.yaml
    - $ref: ../components/parameters/idempotency-key-header.yaml
    - $ref: ../components/parameters/persona-version-header.yaml
    - $ref: ../components/parameters/pagination-query-params.yaml
    - $ref: ../components/parameters/fields-query-parameter.yaml
    - description: Filter theme sets by status — one of "active" or "archived".
      in: query
      name: filter[status]
      required: false
      schema:
        type: string
  responses:
    '200':
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/rate-limit-limit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/rate-limit-remaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/rate-limit-reset.yaml
        Request-Id:
          $ref: ../components/headers/request-id.yaml
        Persona-Environment-Id:
          $ref: ../components/headers/persona-environment-id.yaml
        Persona-Organization-Id:
          $ref: ../components/headers/persona-organization-id.yaml
      content:
        application/json:
          examples:
            Success:
              value:
                data:
                  - type: theme-set
                    id: theset_ABC123
                    attributes:
                      name: Brand Default
                      status: active
                      styles:
                        settings:
                          use-dark-theme: false
                          preferred-theme-variant: light
                        light:
                          inquiry:
                            primary-color:
                              unit: hex
                              value: '#111111'
                          components:
                            button:
                              primary:
                                base:
                                  background-color:
                                    unit: hex
                                    value: '#111111'
                                  text-color:
                                    unit: hex
                                    value: '#FFFFFF'
                      created-at: '2026-01-01T00:00:00.000Z'
                      updated-at: '2026-01-01T00:00:00.000Z'
                      archived-at: null
                links:
                  prev: null
                  next: null
          schema:
            properties:
              data:
                items:
                  $ref: ../components/schemas/theme-set.yaml
                type: array
                description: An array of Theme Sets
              links:
                properties:
                  next:
                    type:
                      - string
                      - 'null'
                  prev:
                    type:
                      - string
                      - 'null'
                type: object
                additionalProperties: false
                required:
                  - next
                  - prev
            type: object
            additionalProperties: false
            required:
              - data
              - links
      description: This endpoint returns a collection of Theme Set objects.
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
post:
  summary: Create a Theme Set
  tags:
    - Theme Sets
  x-persona-product: Inquiries
  description: >-
    Creates a new theme set. The `data` attribute carries the nested theme tree
    (`settings` / `light` / `dark`) — the same shape as the Code-First theme-set
    YAML. Style cells that are not supported are rejected with a 400 naming each
    offending path.
  operationId: create-a-theme-set
  externalDocs:
    description: Full documentation for this API on the Persona website.
    url: https://docs.withpersona.com/api-reference/theme-sets/create-a-theme-set
  parameters:
    - $ref: ../components/parameters/key-inflection-header.yaml
    - $ref: ../components/parameters/idempotency-key-header.yaml
    - $ref: ../components/parameters/persona-version-header.yaml
    - $ref: ../components/parameters/fields-query-parameter.yaml
  requestBody:
    content:
      application/json:
        examples:
          Created:
            value:
              data:
                attributes:
                  name: Brand Default
                  styles:
                    settings:
                      use-dark-theme: false
                      preferred-theme-variant: light
                    light:
                      inquiry:
                        primary-color:
                          unit: hex
                          value: '#111111'
                      components:
                        button:
                          primary:
                            base:
                              background-color:
                                unit: hex
                                value: '#111111'
                              text-color:
                                unit: hex
                                value: '#FFFFFF'
        schema:
          properties:
            data:
              properties:
                attributes:
                  type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      description: Display name of the theme set.
                    styles:
                      $ref: ../components/schemas/theme-set-styles.yaml
                  required:
                    - name
              required:
                - attributes
              type: object
              additionalProperties: false
          required:
            - data
          type: object
          additionalProperties: false
  responses:
    '201':
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/rate-limit-limit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/rate-limit-remaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/rate-limit-reset.yaml
        Request-Id:
          $ref: ../components/headers/request-id.yaml
        Persona-Environment-Id:
          $ref: ../components/headers/persona-environment-id.yaml
        Persona-Organization-Id:
          $ref: ../components/headers/persona-organization-id.yaml
      content:
        application/json:
          examples:
            Created:
              value:
                data:
                  type: theme-set
                  id: theset_ABC123
                  attributes:
                    name: Brand Default
                    status: active
                    styles:
                      settings:
                        use-dark-theme: false
                        preferred-theme-variant: light
                      light:
                        inquiry:
                          primary-color:
                            unit: hex
                            value: '#111111'
                        components:
                          button:
                            primary:
                              base:
                                background-color:
                                  unit: hex
                                  value: '#111111'
                                text-color:
                                  unit: hex
                                  value: '#FFFFFF'
                    created-at: '2026-01-01T00:00:00.000Z'
                    updated-at: '2026-01-01T00:00:00.000Z'
                    archived-at: null
          schema:
            properties:
              data:
                $ref: ../components/schemas/theme-set.yaml
            type: object
            additionalProperties: false
            required:
              - data
      description: This endpoint returns a Theme Set object.
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '409':
      $ref: ../components/responses/conflict.yaml
    '422':
      $ref: ../components/responses/unprocessable-entity.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
