description: >-
  The maximum number of requests permitted in the current rate limit window. For
  an API key with its own rate limit, requests count against both the key's
  limit and the environment's limit, and this header reports whichever is closer
  to being reached, so it can change between responses. On a `429` response, it
  reports the limit that rejected the request. For an API key without its own
  rate limit, it reports the environment's limit. Returned on every
  authenticated response.
schema:
  type: integer
  examples:
    - 300
