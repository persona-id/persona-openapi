title: Business Website Extracted Identity Record
description: >-
  A single identity detail extracted from the business website, with the page it
  was found on.
type: object
additionalProperties: false
properties:
  value:
    description: >-
      The extracted value — for example a business name, address, phone number,
      or email address.
    example: Example Inc
    type:
      - string
      - 'null'
  source:
    description: The URL of the website page the value was extracted from.
    example: https://example.com
    type:
      - string
      - 'null'
