title: Business Nonprofit Report
description: A Business Nonprofit Report
type: object
additionalProperties: false
properties:
  type:
    type: string
    const: report/business-nonprofit
  id:
    type: string
    description: The ID of the report
    example: rep_7WNzPaNcroBKLarNHBjYDLAp
  attributes:
    unevaluatedProperties: false
    allOf:
      - $ref: ./report-shared-attributes.yaml
      - type: object
        properties:
          query:
            type:
              - object
              - 'null'
            additionalProperties: false
            properties:
              ein:
                type: string
                description: >-
                  The Employer Identification Number used to search for the
                  nonprofit.
                example: 12-3456789
          result:
            type:
              - object
              - 'null'
            additionalProperties: false
            properties:
              organization-name:
                type:
                  - string
                  - 'null'
                description: The legal name of the nonprofit.
                example: Candid
              organization-name-aka:
                type:
                  - string
                  - 'null'
                description: Other names associated with the nonprofit.
                example: >-
                  The Foundation Center, Foundation Center, GuideStar, GuideStar
                  USA
              address:
                type:
                  - object
                  - 'null'
                additionalProperties: false
                properties:
                  street-1:
                    type:
                      - string
                      - 'null'
                    example: 32 Old Slip
                  street-2:
                    type:
                      - string
                      - 'null'
                    example: 24th Floor
                  city:
                    type:
                      - string
                      - 'null'
                    example: New York
                  subdivision:
                    type:
                      - string
                      - 'null'
                    example: NY
                  postal-code:
                    type:
                      - string
                      - 'null'
                    example: '10005'
                  country-code:
                    type:
                      - string
                      - 'null'
                    example: US
              foundation-type-code:
                type:
                  - string
                  - 'null'
                example: PC
              foundation-type-description:
                type:
                  - string
                  - 'null'
                example: Public charity described in section 509(a)(1) or (2)
              irs-filing-requirement-code:
                type:
                  - string
                  - 'null'
                example: '010'
              irs-pub-78-details:
                type:
                  - object
                  - 'null'
                additionalProperties: false
                properties:
                  church-message:
                    type:
                      - string
                      - 'null'
                  organization-name:
                    type:
                      - string
                      - 'null'
                    example: Candid
                  ein:
                    type:
                      - string
                      - 'null'
                    example: 12-3456789
                  verified:
                    type:
                      - boolean
                      - 'null'
                    example: true
                  city:
                    type:
                      - string
                      - 'null'
                    example: New York
                  state:
                    type:
                      - string
                      - 'null'
                    example: NY
                  organization-types:
                    type:
                      - array
                      - 'null'
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        organization-type:
                          type:
                            - string
                            - 'null'
                          example: A public charity (50% deductibility limitation).
                        deductibility-limitation:
                          type:
                            - string
                            - 'null'
                          example: 50%
                        deductibility-status-description:
                          type:
                            - string
                            - 'null'
                          example: PC
                  most-recent-pub78:
                    type:
                      - string
                      - 'null'
                    example: 4/13/2021 4:00:00 AM
                  most-recent-irb:
                    type:
                      - string
                      - 'null'
                    example: 4/26/2021 12:00:00 AM
                  bulletin-number:
                    type:
                      - string
                      - 'null'
                    example: 2020-05
                  bulletin-url:
                    type:
                      - string
                      - 'null'
                    format: uri
                    example: https://www.irs.gov/pub/irs-irbs/irb20-05.pdf
              irs-bmf-details:
                type:
                  - object
                  - 'null'
                additionalProperties: false
                properties:
                  church-message:
                    type:
                      - string
                      - 'null'
                  organization-name:
                    type:
                      - string
                      - 'null'
                    example: CANDID
                  ein:
                    type:
                      - string
                      - 'null'
                    example: 12-3456789
                  status:
                    type:
                      - boolean
                      - 'null'
                    example: true
                  most-recent-bmf:
                    type:
                      - string
                      - 'null'
                    example: 4/12/2021 4:00:00 AM
                  subsection:
                    type:
                      - string
                      - 'null'
                    example: '03'
                  subsection-description:
                    type:
                      - string
                      - 'null'
                    example: 501(c)(3) Public Charity
                  ruling-month:
                    type:
                      - string
                      - 'null'
                    example: '06'
                  ruling-year:
                    type:
                      - string
                      - 'null'
                    example: '1957'
                  revocation-reason:
                    type:
                      - string
                      - 'null'
                    example: failure_to_file
                  revocation-date:
                    type:
                      - string
                      - 'null'
                    example: 1/12/2021 2:23:09 PM
              ca-ag-details:
                type:
                  - object
                  - 'null'
                additionalProperties: false
                properties:
                  status:
                    type:
                      - string
                      - 'null'
                    example: May Operate or Solicit for Charitable Purposes
                  registry-status:
                    type:
                      - string
                      - 'null'
                    example: Current
                  state-charity-reg-num:
                    type:
                      - string
                      - 'null'
                    example: CT0257773
                  issue-date:
                    type:
                      - string
                      - 'null'
                    example: '2018-05-15'
                  last-renewal-date:
                    type:
                      - string
                      - 'null'
                    example: '2018-05-15'
                  status-set-date:
                    type:
                      - string
                      - 'null'
                    example: '2018-09-12'
                  as-of-date:
                    type:
                      - string
                      - 'null'
                    example: '2023-05-17'
                  most-recent-ag:
                    type:
                      - string
                      - 'null'
                    example: '2023-04-19'
              ca-ftb-details:
                type:
                  - object
                  - 'null'
                additionalProperties: false
                properties:
                  revocation-status:
                    type:
                      - boolean
                      - 'null'
                    example: true
                  revocation-status-date:
                    type:
                      - string
                      - 'null'
                    example: '2017-03-28'
                  most-recent-ftb:
                    type:
                      - string
                      - 'null'
                    example: '2023-04-19'
  relationships:
    $ref: ./report-shared-relationships.yaml
