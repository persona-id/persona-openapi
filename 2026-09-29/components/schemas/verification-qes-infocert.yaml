title: QES InfoCert Verification
description: A Qualified Electronic Signature (QES) Verification via InfoCert
type: object
additionalProperties: false
properties:
  type:
    type: string
    const: verification/qes-infocert
  id:
    type: string
    description: The token of the verification
    example: ver_ABC123
  attributes:
    unevaluatedProperties: false
    allOf:
      - $ref: ./verification-shared-attributes.yaml
      - type: object
        properties:
          tentative-sub-state:
            description: >-
              An InfoCert-specific sub-state describing why the verification is
              in a tentative status. Only populated when the verification status
              is `tentatively_passed` or `tentatively_failed`.
            type:
              - string
              - 'null'
          attestation-pdf:
            description: >-
              The signed attestation document. Null unless the verification
              passed and the signed document is available.
            $ref: ./file.yaml
          infocert-reject-reason:
            description: >-
              Code for why the verification was rejected. Null unless the
              verification was rejected.
            type:
              - string
              - 'null'
            examples:
              - reject.invalidIdentityDocument.documentExpired
          infocert-reject-reason-description:
            description: >-
              Readable description of `infocert-reject-reason`. Null if there is
              no reject reason or the code is not recognized.
            type:
              - string
              - 'null'
            examples:
              - Identity document expired
          infocert-reason-note:
            description: >-
              Free-text note explaining the rejection. Null if no note was
              provided.
            type:
              - string
              - 'null'
  relationships:
    $ref: ./verification-shared-relationships.yaml
