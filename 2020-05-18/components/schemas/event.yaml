type: object
additionalProperties: false
description: An Event object
properties:
  type:
    type: string
    const: event
  id:
    type: string
    examples:
      - evt_ABC123
  attributes:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        examples:
          - inquiry.expired
          - workflow-run.created
          - account.tag-added
          - custom.object.processed
      payload:
        description: >-
          For a Persona-defined event, the entire serialized entity that
          triggered it. For a custom event, the arbitrary body you supplied when
          creating it, returned exactly as sent -- its keys are never re-cased.
        type: object
        additionalProperties: true
        properties:
          data:
            type: object
            additionalProperties: false
            properties:
              type:
                x-polymorphic: true
                type: string
                examples:
                  - inquiry
                  - workflow-run
                  - account
              id:
                type: string
                examples:
                  - inq_ABC123
                  - wfr_ABC123
                  - act_ABC123
              attributes:
                type: object
                additionalProperties: true
              relationships:
                type: object
                additionalProperties: true
      created-at:
        type: string
        format: date-time
        examples:
          - '2023-09-23T17:14:01.918Z'
      context:
        type: object
        description: Additional context populated for some event types.
        additionalProperties: true
