type: object
additionalProperties: true
description: >-
  One theme variant: `inquiry` holds flow chrome (navbar, modal, hosted flow),
  `components` holds the per-component style grid (component → variant → state →
  properties). Value leaves are typed objects such as `{ unit: hex, value:
  "#111111" }` (color), `{ unit: px, value: 16 }` (size), `{ x: ..., y: ... }`
  (dimensions) and `{ bitmask: 15 }` (corner mask). The accepted cells are
  exactly those of the Code-First theme-set YAML shape.
properties:
  inquiry:
    type: object
    additionalProperties: true
  components:
    type: object
    additionalProperties: true
  step-assets:
    type: object
    additionalProperties: true
