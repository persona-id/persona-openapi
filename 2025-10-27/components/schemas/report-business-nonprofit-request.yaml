title: Business Nonprofit Report
description: Fields required to create a Business Nonprofit Report
type: object
additionalProperties: false
properties:
  type:
    type: string
    const: report/business-nonprofit
  attributes:
    unevaluatedProperties: false
    allOf:
      - $ref: ./report-shared-request-attributes.yaml
      - type: object
        properties:
          query:
            type: object
            additionalProperties: false
            properties:
              ein:
                type: string
                description: >-
                  The nine-digit Employer Identification Number of the
                  nonprofit.
                pattern: ^[0-9]{2}-?[0-9]{7}$
                example: 12-3456789
            required:
              - ein
        required:
          - query
required:
  - attributes
