description: A dismissed entity or media item on a Business Adverse Media report
type: object
additionalProperties: false
properties:
  entity-id:
    type: string
    example: FV933QHOUDG73V8
  ignored-at:
    type: string
    format: date-time
    example: '2023-09-13T22:08:56.618Z'
  run-history-completed-at:
    type:
      - string
      - 'null'
    format: date-time
    example: '2023-08-11T20:36:04.291Z'
  match:
    $ref: ./report-business-adverse-media-match.yaml
  ignore-reason:
    type:
      - string
      - 'null'
    example: false positive
  user:
    type: string
    example: John Doe
