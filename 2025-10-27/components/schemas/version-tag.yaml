description: The version's deployment tag, when one was minted.
unevaluatedProperties: false
oneOf:
  - type: 'null'
  - type: object
    additionalProperties: false
    required:
      - name
      - description
      - created-at
    properties:
      name:
        type: string
      description:
        type:
          - string
          - 'null'
      created-at:
        type: string
        format: date-time
examples:
  - name: v2
    description: Initial production release
    created-at: '2026-03-26T18:29:41.000Z'
