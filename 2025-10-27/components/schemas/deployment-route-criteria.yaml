description: >-
  A deployment route criteria node: an `and`/`or`/`!` operator tree whose
  `origin` leaves are either `{ context }` or `{ resource-type, template-id,
  version }`. Version references carry the version token and its deployment tag
  (null when the version is untagged). Each operator's operand may be a single
  node or a non-empty array of nodes.
unevaluatedProperties: false
oneOf:
  - type: object
    additionalProperties: false
    required:
      - and
    properties:
      and:
        x-inheritable: true
        oneOf:
          - $ref: ./deployment-route-criteria.yaml
          - type: array
            minItems: 1
            items:
              $ref: ./deployment-route-criteria.yaml
  - type: object
    additionalProperties: false
    required:
      - or
    properties:
      or:
        x-inheritable: true
        oneOf:
          - $ref: ./deployment-route-criteria.yaml
          - type: array
            minItems: 1
            items:
              $ref: ./deployment-route-criteria.yaml
  - type: object
    additionalProperties: false
    required:
      - '!'
    properties:
      '!':
        x-inheritable: true
        oneOf:
          - $ref: ./deployment-route-criteria.yaml
          - type: array
            minItems: 1
            items:
              $ref: ./deployment-route-criteria.yaml
  - type: object
    additionalProperties: false
    required:
      - origin
    properties:
      origin:
        x-inheritable: true
        oneOf:
          - type: object
            additionalProperties: false
            required:
              - context
            properties:
              context:
                type: string
                description: The request context the route matches on.
                examples:
                  - mobile
          - type: object
            additionalProperties: false
            required:
              - resource-type
              - template-id
            properties:
              resource-type:
                type: string
                description: The platform resource type the origin targets.
                examples:
                  - inquiry-template
              template-id:
                type: string
                description: The token of the resource template the origin targets.
                examples:
                  - itmpl_ABC123
              version:
                type:
                  - object
                  - 'null'
                additionalProperties: false
                required:
                  - token
                  - tag
                properties:
                  token:
                    type: string
                  tag:
                    type:
                      - string
                      - 'null'
                    description: The version's deployment tag, when one was minted.
                    examples:
                      - '3'
