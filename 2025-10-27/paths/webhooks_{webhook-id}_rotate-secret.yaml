post:
  description: >
    Rotates a webhook's secret by creating a new secret.


    The old secret stays active for the number of seconds you pass in
    `meta.expires-in-seconds`. If you omit it, it defaults to `0`: the old
    secret expires immediately and there is no overlap, so deliveries signed
    only with the new secret start right away. To rotate without downtime, set
    `expires-in-seconds` long enough to cover deploying the new secret to your
    endpoint.


    ## Signatures during rotation


    While both secrets are active, Persona signs every webhook event with each
    of them. The `Persona-Signature` header then contains one
    `t=<unix_timestamp>,v1=<signature>` set per active secret, separated by a
    space:


    ```text

    t=1764686826,v1=<signature_from_one_secret>
    t=1764686826,v1=<signature_from_the_other_secret>

    ```


    The order of the sets is not guaranteed. Your handler must check every `v1`
    signature in the header and accept the request if **any** of them matches.
    Once the old secret expires, the header contains a single set again.


    ## Rotating without downtime


    1. Update your handler to check every `v1` signature in the
    `Persona-Signature` header, as described in [Checking
    signatures](https://docs.withpersona.com/webhooks-best-practices#checking-signatures).

    2. Call this endpoint with an `expires-in-seconds` long enough to cover your
    deployment.

    3. Deploy the new secret to your endpoint.

    4. Let the old secret expire.


    A webhook can have only one expiring secret at a time. Calling this endpoint
    again while the old secret is still active does not create another secret.
    Instead, it moves the old secret's expiration to `expires-in-seconds` from
    now, which can only make it sooner (pass `0` to expire it immediately).


    For more details, see [Rotating secrets
    safely](https://docs.withpersona.com/webhooks-best-practices#rotating-secrets-safely)
    and [Quickstart:
    Webhooks](https://docs.withpersona.com/quickstart-webhooks).
  operationId: rotate-a-webhook-secret
  externalDocs:
    description: Full documentation for this API on the Persona website.
    url: >-
      https://docs.withpersona.com/api-reference/webhooks/rotate-a-webhook-secret
  parameters:
    - $ref: ../components/parameters/key-inflection-header.yaml
    - $ref: ../components/parameters/idempotency-key-header.yaml
    - $ref: ../components/parameters/persona-version-header.yaml
    - $ref: ../components/parameters/include-query-parameter.yaml
    - $ref: ../components/parameters/fields-query-parameter.yaml
    - description: Webhook's ID (starts with "wbh_")
      in: path
      name: webhook-id
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        examples:
          Success:
            $ref: ../components/examples/rotate-webhook-secret.yaml
        schema:
          type: object
          additionalProperties: false
          properties:
            meta:
              type: object
              additionalProperties: false
              properties:
                expires-in-seconds:
                  description: >
                    Number of seconds the current secret stays active after
                    rotation. During this window Persona signs each webhook
                    event with both the old and new secrets. Defaults to `0`,
                    which expires the old secret immediately. Set it long enough
                    to deploy the new secret to your endpoint.


                    If the webhook already has an expiring secret, this instead
                    sets that secret's expiration to this many seconds from now.
                    It can only move the expiration sooner.
                  example: 7200
                  type: integer
  responses:
    '200':
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/rate-limit-limit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/rate-limit-remaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/rate-limit-reset.yaml
        Request-Id:
          $ref: ../components/headers/request-id.yaml
        Persona-Environment-Id:
          $ref: ../components/headers/persona-environment-id.yaml
        Persona-Organization-Id:
          $ref: ../components/headers/persona-organization-id.yaml
      content:
        application/json:
          examples:
            Success:
              $ref: ../components/examples/webhook-created.yaml
          schema:
            properties:
              data:
                $ref: ../components/schemas/webhook-with-secret.yaml
              included:
                $ref: ../components/schemas/empty-included-objects.yaml
            type: object
            additionalProperties: false
            required:
              - data
      description: This endpoint returns a Webhook object.
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '409':
      $ref: ../components/responses/conflict.yaml
    '422':
      $ref: ../components/responses/unprocessable-entity.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
  summary: Rotate a Webhook's secret
  tags:
    - Webhooks
  x-persona-product: Webhooks
