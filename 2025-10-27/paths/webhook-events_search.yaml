post:
  description: >
    Search for webhook events using a flexible query language.


    Webhook events are the individual delivery records for your webhooks — one
    per event, per

    webhook. Use this endpoint to find events (for example, all `failed`
    deliveries for a given

    webhook in a time window) before re-running them.


    ## Data Freshness


    Do not use search for read-after-write flows because the data will not be
    immediately available

    to search. Under normal operating conditions, data is searchable within
    approximately 1 minute

    of creation or modification. Propagation could be delayed during an outage.


    ## Retention


    Webhook events are retained for a limited window. Searches are automatically
    bounded to that

    window, so events older than the retention period are not returned even if
    requested.


    ### Searchable Attributes


    The following attributes can be used in query predicates:


    | Attribute | Description |

    |-----------|-------------|

    | `updated_at` | Timestamp the event was last updated (i.e. last delivery
    attempt). Supports `eq`, `gt`, `gte`, `lt`, `lte`. |

    | `status` | Delivery status: `pending`, `completed`, `failed`, or
    `skipped`. |

    | `webhook_id` | Webhook token (e.g. `wbh_ABC123`). |

    | `event_id` | Event token the webhook event was created from (e.g.
    `evt_ABC123`). |

    | `event_name` | Event name (e.g. `inquiry.completed`). |

    | `webhook_event_id` | Webhook event token (e.g. `wbhe_ABC123`). |

    | `related_object_ids` | A related object token contained in the event
    payload. |


    All attributes other than `updated_at` support only the `eq` operator.
  operationId: search-webhook-events
  externalDocs:
    description: Full documentation for this API on the Persona website.
    url: >-
      https://docs.withpersona.com/api-reference/webhook-events/search-webhook-events
  parameters:
    - $ref: ../components/parameters/key-inflection-header.yaml
    - $ref: ../components/parameters/idempotency-key-header.yaml
    - $ref: ../components/parameters/persona-version-header.yaml
    - $ref: ../components/parameters/fields-query-parameter.yaml
    - in: query
      name: page
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: false
        properties:
          after:
            description: >-
              Cursor for forward pagination. Use the value from `links.next` in
              the previous response. Cursors are opaque and must not be
              constructed by clients.
            type: string
            examples:
              - eyJ2IjoxfQ==
          before:
            description: >-
              Cursor for backward pagination. Use the value from `links.prev` in
              the previous response. Cursors are opaque and must not be
              constructed by clients. Cannot be combined with `after`.
            type: string
            examples:
              - eyJ2IjoxfQ==
          size:
            description: Number of results to return per page.
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            examples:
              - 10
  requestBody:
    content:
      application/json:
        schema:
          properties:
            query:
              description: >
                Search query using boolean logic (AND/OR/NOT) and comparison
                operators.

                Supports predicates with operators: eq (equal), gt (greater
                than), gte (greater than or equal),

                lt (less than), lte (less than or equal). Only `updated_at`
                supports the range operators;

                all other attributes support only `eq`.
              unevaluatedProperties: false
              oneOf:
                - type: object
                  x-inheritable: true
                  additionalProperties: false
                  description: >
                    Boolean AND clause - combines multiple conditions where ALL
                    must be true.


                    This clause is recursive: each item in the `and` array can
                    be another AND, OR, NOT clause, or a leaf predicate,
                    enabling complex nested queries.


                    Maximum nesting depth: 2 levels, Maximum clauses per AND: 20
                  properties:
                    and:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                  required:
                    - and
                - type: object
                  x-inheritable: true
                  additionalProperties: false
                  description: >
                    Boolean OR clause - combines multiple conditions where AT
                    LEAST ONE must be true.


                    This clause is recursive: each item in the `or` array can be
                    another AND, OR, NOT clause, or a leaf predicate, enabling
                    complex nested queries.


                    Maximum nesting depth: 2 levels, Maximum clauses per OR: 20
                  properties:
                    or:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                  required:
                    - or
                - type: object
                  x-inheritable: true
                  additionalProperties: false
                  description: >
                    Boolean NOT clause - negates a single condition.


                    This clause is recursive: the `not` value can be another
                    AND, OR, NOT clause, or a leaf predicate, enabling complex
                    nested queries.


                    Maximum nesting depth: 2 levels
                  properties:
                    not:
                      type: object
                      additionalProperties: true
                  required:
                    - not
                - type: object
                  x-inheritable: true
                  additionalProperties: false
                  description: Attribute predicate
                  properties:
                    attribute:
                      type: string
                      description: >-
                        The attribute name to filter on (e.g., 'updated_at',
                        'status', 'webhook_id', 'event_name')
                      examples:
                        - updated_at
                        - status
                        - webhook_id
                        - event_name
                    operator:
                      type: string
                      description: >-
                        Comparison operator. Possible values: eq (equal), gt
                        (greater than), gte (greater than or equal), lt (less
                        than), lte (less than or equal).
                    value:
                      description: Value to compare against
                      x-inheritable: true
                      unevaluatedProperties: false
                      oneOf:
                        - type: string
                        - type: number
                        - type: boolean
                  required:
                    - attribute
                    - operator
                    - value
              examples:
                - attribute: status
                  operator: eq
                  value: failed
                - and:
                    - attribute: webhook_id
                      operator: eq
                      value: wbh_1a2b3c
                    - attribute: updated_at
                      operator: gte
                      value: '2026-04-23T00:00:00Z'
            sort:
              description: Sort configuration for results
              type: object
              additionalProperties: false
              properties:
                attribute:
                  type: string
                  description: >-
                    The attribute name to sort by. Only `updated_at` is
                    supported.
                  examples:
                    - updated_at
                direction:
                  type: string
                  default: desc
                  description: >-
                    Sort direction. Possible values: asc (ascending), desc
                    (descending).
              required:
                - attribute
                - direction
            page:
              description: Pagination parameters
              type: object
              additionalProperties: false
              properties:
                after:
                  description: >-
                    Cursor for forward pagination. Opaque; use the value from
                    `links.next`.
                  type: string
                  examples:
                    - eyJ2IjoxfQ==
                before:
                  description: >-
                    Cursor for backward pagination. Opaque; use the value from
                    `links.prev`. Cannot be combined with `after`.
                  type: string
                  examples:
                    - eyJ2IjoxfQ==
                size:
                  description: Number of results to return per page
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                  examples:
                    - 10
          additionalProperties: false
          type: object
        examples:
          Simple query:
            value:
              query:
                attribute: status
                operator: eq
                value: failed
              sort:
                attribute: updated_at
                direction: desc
              page:
                size: 15
          Complex boolean query:
            value:
              query:
                and:
                  - attribute: webhook_id
                    operator: eq
                    value: wbh_1a2b3c
                  - attribute: status
                    operator: eq
                    value: failed
                  - attribute: updated_at
                    operator: gte
                    value: '2026-04-23T00:00:00Z'
              page:
                size: 15
          Empty query (all webhook events):
            value:
              page:
                size: 15
  responses:
    '200':
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/rate-limit-limit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/rate-limit-remaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/rate-limit-reset.yaml
        Request-Id:
          $ref: ../components/headers/request-id.yaml
        Persona-Environment-Id:
          $ref: ../components/headers/persona-environment-id.yaml
        Persona-Organization-Id:
          $ref: ../components/headers/persona-organization-id.yaml
      content:
        application/json:
          examples:
            Success:
              $ref: ../components/examples/webhook-event-list-search.yaml
          schema:
            properties:
              data:
                items:
                  $ref: ../components/schemas/webhook-event.yaml
                type: array
                description: An array of Webhook Events matching the search criteria
              links:
                properties:
                  prev:
                    type:
                      - string
                      - 'null'
                    examples:
                      - >-
                        /api/v1/webhook-events/search?page%5Bbefore%5D=eyJ2IjoxfQ%3D%3D&page%5Bsize%5D=10
                    description: >-
                      URL pointing to the previous page of data, or null if on
                      the first page. Must be used with a POST request and the
                      original request body.
                  next:
                    type:
                      - string
                      - 'null'
                    examples:
                      - >-
                        /api/v1/webhook-events/search?page%5Bafter%5D=eyJ2IjoxfQ%3D%3D&page%5Bsize%5D=10
                    description: >-
                      URL pointing to the next page of data, or null if on the
                      last page. Must be used with a POST request and the
                      original request body.
                additionalProperties: false
                type: object
                required:
                  - prev
                  - next
            additionalProperties: false
            type: object
            required:
              - data
              - links
      description: >-
        This endpoint returns a collection of Webhook Event objects matching the
        search criteria.
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '409':
      $ref: ../components/responses/conflict.yaml
    '422':
      $ref: ../components/responses/unprocessable-entity.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
  summary: Search Webhook Events
  tags:
    - Webhook Events
  x-persona-product: Webhooks
