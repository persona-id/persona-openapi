type: object
additionalProperties: false
description: Comment on a Case object
properties:
  type:
    type: string
    const: case-comment
  id:
    type: string
    description: Unique identifier for the Case Comment
    examples:
      - cscm_yd2urRmjaCWcSSxqTSHvUcsn
  attributes:
    type: object
    additionalProperties: false
    properties:
      message:
        type:
          - string
          - 'null'
        description: The comment message. Null once the comment has been redacted.
        examples:
          - This is a case comment
      created-at:
        type: string
        format: date-time
        description: The time the comment was created
        examples:
          - '2021-03-25T07:04:16.667Z'
      updated-at:
        type: string
        format: date-time
        description: The time the comment was last updated
        examples:
          - '2021-03-25T07:04:16.667Z'
      redacted-at:
        type:
          - string
          - 'null'
        format: date-time
        description: >-
          The time the comment was redacted, or null if it has not been
          redacted. A redacted comment keeps its identifiers and timestamps but
          its message is cleared.
        examples:
          - '2021-03-25T07:04:16.667Z'
      commenter-id:
        type: string
        description: The ID of the user who made the comment
        examples:
          - admin@example.com
      commenter-type:
        type: string
        description: The type of the commenter
        examples:
          - user
