type: object
additionalProperties: false
description: A Workflow Version object
properties:
  type:
    const: workflow-version
    type: string
  id:
    examples:
      - wfv_3JqAR9ddLRVZLK5z4yD8oeHB
    type: string
  attributes:
    properties:
      workflow-name:
        type:
          - string
          - 'null'
        description: The name of the Workflow this version belongs to.
        examples:
          - KYC Review Workflow
      description:
        type:
          - string
          - 'null'
        description: >-
          A description of the changes in this version. Draft versions have no
          description until one is set.
        examples:
          - Add manual review escalation
      status:
        description: |-
          The status of the Workflow Version

          Possible values:
          - draft
          - published
          - archived

          Do not assume this is a static enumeration; Persona may add new
          values in the future without a versioned update.
        type: string
        examples:
          - published
      trigger-type:
        description: |-
          What starts a run of this version. Null until a trigger is attached.

          Possible values:
          - trigger-account
          - trigger-api
          - trigger-case
          - trigger-direct
          - trigger-event
          - trigger-recurring
          - trigger-schedule
          - trigger-verification

          Do not assume this is a static enumeration; Persona may add new
          values in the future without a versioned update.
        type:
          - string
          - 'null'
        examples:
          - trigger-api
      live:
        type: boolean
        description: >-
          Whether this version is running in the environment of the requesting
          API key or delivering webhook. While a Workflow is being rolled out,
          two versions are live at once; both report true. Always false while
          the Workflow itself is paused or archived.
        examples:
          - true
      rollout-label:
        description: >-
          Which side of a rollout this version serves. Null when the version is
          not live —

          including while the Workflow is paused or archived — and for
          organizations whose

          deployments do not model a per-version traffic share.


          Possible values:

          - treatment

          - control


          Do not assume this is a static enumeration; Persona may add new

          values in the future without a versioned update.
        type:
          - string
          - 'null'
        examples:
          - treatment
      rollout-percentage:
        type:
          - integer
          - 'null'
        minimum: 1
        maximum: 100
        description: >-
          The share of traffic this version receives in the environment of the
          requesting API key or delivering webhook. Null when the version is not
          live — including while the Workflow is paused or archived — and for
          organizations whose deployments do not model a per-version traffic
          share.
        examples:
          - 100
      last-updater:
        type:
          - string
          - 'null'
        description: >-
          The email address of the User who last updated this version. Null when
          the version was last updated by Persona rather than by a member of
          your organization.
        examples:
          - taylor@example.com
      inputs:
        type: array
        description: The values a run of this version accepts when it is started.
        items:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              examples:
                - account_id
            type:
              type:
                - string
                - 'null'
              description: The JSON type accepted for this input.
              examples:
                - string
            required:
              type: boolean
              examples:
                - true
      outputs:
        type: array
        description: The values a completed run of this version returns.
        items:
          type: object
          additionalProperties: false
          properties:
            name:
              type:
                - string
                - 'null'
              examples:
                - risk_score
      created-at:
        examples:
          - '2022-08-08T18:55:44.910Z'
        type: string
        format: date-time
      updated-at:
        type: string
        format: date-time
        description: >-
          When this version was last edited. Does not cover edits to `inputs` or
          `outputs`; poll those values directly rather than this timestamp to
          detect input-contract changes.
        examples:
          - '2022-08-09T17:12:03.221Z'
      published-at:
        type:
          - string
          - 'null'
        format: date-time
        examples:
          - '2022-08-09T17:12:03.221Z'
    type: object
    additionalProperties: false
  relationships:
    properties:
      workflow:
        properties:
          data:
            properties:
              type:
                const: workflow
                type: string
              id:
                examples:
                  - wfl_3VghhbvDc7UuUNT8uZrqZjsk
                type: string
            type: object
            additionalProperties: false
        type: object
        additionalProperties: false
    type: object
    additionalProperties: false
