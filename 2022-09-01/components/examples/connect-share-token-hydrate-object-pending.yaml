summary: Hydrate an object
description: >-
  The Share Token is pending while Persona imports the source data into an
  existing object. This example hydrates an Inquiry.
value:
  data:
    type: connect/share-token
    id: cnst_DEF456
    attributes:
      status: pending
      direction: inbound
      created-at: '2023-08-17T23:18:13.000Z'
      updated-at: '2023-08-17T23:25:00.000Z'
      pending-at: '2023-08-17T23:25:00.000Z'
      redeemed-at: null
      expires-at: null
      failed-at: null
      failure-reason: null
      redeem-mode: hydrate
    relationships:
      destination:
        data:
          type: inquiry
          id: inq_XYZ789
      connection:
        data:
          type: connect/connection
          id: cxn_ABC123
