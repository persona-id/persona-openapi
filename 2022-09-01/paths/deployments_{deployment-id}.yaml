get:
  description: >-
    Retrieves a single deployment. Its `routes` carry the effective state as of
    it — the newest route per (resource template, environment) key at or before
    the deployment, across every environment and template — including routes
    written by earlier deployments. Because the response is a snapshot, it can
    look similar to the list endpoint; it does not list other deployments.

    This endpoint does not accept filters. To see only the routes a deployment
    wrote, use the list endpoint with `filter[changes-only]=true`.

    This endpoint requires a production API key; sandbox API keys receive 401.
  operationId: retrieve-a-deployment
  parameters:
    - $ref: ../components/parameters/key-inflection-header.yaml
    - $ref: ../components/parameters/idempotency-key-header.yaml
    - $ref: ../components/parameters/persona-version-header.yaml
    - $ref: ../components/parameters/fields-query-parameter.yaml
    - name: deployment-id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      headers:
        RateLimit-Limit:
          $ref: ../components/headers/rate-limit-limit.yaml
        RateLimit-Remaining:
          $ref: ../components/headers/rate-limit-remaining.yaml
        RateLimit-Reset:
          $ref: ../components/headers/rate-limit-reset.yaml
        Request-Id:
          $ref: ../components/headers/request-id.yaml
        Persona-Environment-Id:
          $ref: ../components/headers/persona-environment-id.yaml
        Persona-Organization-Id:
          $ref: ../components/headers/persona-organization-id.yaml
      content:
        application/json:
          examples:
            Success:
              $ref: ../components/examples/deployment.yaml
          schema:
            properties:
              data:
                $ref: ../components/schemas/deployment.yaml
            type: object
            additionalProperties: false
            required:
              - data
      description: This endpoint returns a Deployment object.
    '400':
      $ref: ../components/responses/bad-request.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '403':
      $ref: ../components/responses/forbidden.yaml
    '404':
      $ref: ../components/responses/not-found.yaml
    '429':
      $ref: ../components/responses/too-many-requests.yaml
  summary: Retrieve a Deployment
  tags:
    - Deployments
  x-persona-product: Deployments
