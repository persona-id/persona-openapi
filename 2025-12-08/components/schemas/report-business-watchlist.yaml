title: Business Watchlist Report
description: A Business Watchlist Report
type: object
additionalProperties: false
properties:
  type:
    type: string
    const: report/business-watchlist
  id:
    type: string
    description: The ID of the report
    examples:
      - rep_8YZjQaNjXpZLKrJNHBkYDLAp
  attributes:
    unevaluatedProperties: false
    allOf:
      - $ref: ./report-shared-attributes.yaml
      - type: object
        properties:
          term:
            type:
              - string
              - 'null'
            description: >-
              The search term for the business watchlist report, typically the
              name of the business.
            example: Acme Corporation
          matched-lists:
            type: array
            description: A list of slugs identifying the lists on which matches were found.
            items:
              type: string
          sanction-list:
            type: array
            description: Detailed information about matches found on sanction lists.
            items:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: The name of the sanction list.
                url:
                  type: string
                  format: uri
                  description: A URL with more information about the list.
          fitness-probity-list:
            type: array
            description: >-
              Detailed information about matches found on fitness and probity
              lists.
            items:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: The name of the fitness and probity list.
                url:
                  type: string
                  format: uri
                  description: A URL with more information about the list.
          warning-list:
            type: array
            description: Detailed information about matches found on warning lists.
            items:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: The name of the warning list.
                url:
                  type: string
                  format: uri
                  description: A URL with more information about the list.
          ignore-list:
            type: array
            description: >-
              Matches that have been dismissed, and the details of that
              dismissal.
            items:
              type: object
              additionalProperties: false
              properties:
                ignored-at:
                  type: string
                  format: date-time
                  example: '2023-09-13T22:08:56.618Z'
                run-history-completed-at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  example: '2023-08-11T20:36:04.291Z'
                match:
                  type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      example: Acme Sanctioned Holdings
                    url:
                      type:
                        - string
                        - 'null'
                      format: uri
                      example: >-
                        https://sanctionslist.example.com/acme-sanctioned-holdings
                    list-type:
                      type: string
                      example: sanction
                    list-types:
                      type: array
                      items:
                        type: string
                        example: sanction
                    slug:
                      type:
                        - string
                        - 'null'
                      example: eu-ec-programme-prk
                    country-code:
                      type:
                        - string
                        - 'null'
                      example: EU
                    flag-code:
                      type:
                        - string
                        - 'null'
                      example: EU
                    entities:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          name:
                            type: string
                            example: Acme Sanctioned Holdings
                          alias-type:
                            type:
                              - string
                              - 'null'
                            example: primary_name
                          match-levels:
                            type: array
                            items:
                              type: string
                              example: name_exact
                user:
                  type: string
                  example: John Doe
                ignore-reason:
                  type:
                    - string
                    - 'null'
                  example: false positive
  relationships:
    $ref: ./report-shared-relationships.yaml
