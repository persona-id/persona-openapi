type: object
additionalProperties: false
properties:
  resource-type:
    type: string
    description: >-
      The platform resource type the route targets: `inquiry-template`, or
      `workflow` for an organization that uses the Workflow Deployment Manager.
      A `deployment.completed` event keeps the routes it was sent with.
      `scheduled-run-config` support is planned for a future deploy-manager
      release.
    examples:
      - inquiry-template
      - workflow
  template-id:
    type: string
    description: >-
      The token of the resource template the route targets: an Inquiry Template
      or a Workflow.
    examples:
      - itmpl_H5wJqL8vNrXmPyKsTdGc2Vz
  environment:
    type: object
    additionalProperties: false
    required:
      - token
      - name
    description: The environment the route applies to.
    properties:
      token:
        type: string
        examples:
          - env_2VpXc7nMqZwKjRfLsGdYb8Ht
      name:
        type: string
        examples:
          - production
  rules:
    type: array
    description: >-
      The routing rules evaluated for the key. An empty list undeploys the
      resource from the environment. Each rule has a strategy and may have a
      criteria tree with `and`, `or`, and `!` operators over context or resource
      origins.
    items:
      type: object
      additionalProperties: false
      required:
        - strategy
      properties:
        criteria:
          $ref: ./route-criteria.yaml
        strategy:
          unevaluatedProperties: false
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - type
                - ref-type
                - version
              properties:
                type:
                  type: string
                  const: constant
                ref-type:
                  type: string
                  const: version
                  description: The strategy runs the named version.
                version:
                  type: object
                  additionalProperties: false
                  required:
                    - token
                    - tag
                  properties:
                    token:
                      type: string
                      description: The resource version's token.
                      examples:
                        - itmplv_LIVE123
                    tag:
                      $ref: ./version-tag.yaml
            - type: object
              additionalProperties: false
              required:
                - type
                - ref-type
              properties:
                type:
                  type: string
                  const: constant
                ref-type:
                  type: string
                  const: noop
                  description: >-
                    The strategy starts no run ("don't run") and names no
                    version.
            - type: object
              additionalProperties: false
              required:
                - type
                - version-refs
              properties:
                type:
                  type: string
                  const: weighted-random
                version-refs:
                  type: array
                  items:
                    unevaluatedProperties: false
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required:
                          - ref-type
                          - version
                          - weight
                        properties:
                          ref-type:
                            type: string
                            const: version
                            description: This share of runs gets the named version.
                          version:
                            type: object
                            additionalProperties: false
                            required:
                              - token
                              - tag
                            properties:
                              token:
                                type: string
                              tag:
                                $ref: ./version-tag.yaml
                          weight:
                            type: integer
                            description: The ref's weight within the weighted split.
                            examples:
                              - 80
                      - type: object
                        additionalProperties: false
                        required:
                          - ref-type
                          - weight
                        properties:
                          ref-type:
                            type: string
                            const: noop
                            description: >-
                              This share of runs starts no run ("don't run") and
                              names no version.
                          weight:
                            type: integer
                            description: The ref's weight within the weighted split.
                            examples:
                              - 90
  source-deployment-id:
    type:
      - string
      - 'null'
    description: >-
      The token of the deployment that wrote this route. On a Deployment, set
      only when the route predates that deployment, and null when that
      deployment wrote it.
    examples:
      - dply_1AbCdEfGhIjKlMnOpQrStUv
