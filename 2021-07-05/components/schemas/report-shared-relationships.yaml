type: object
additionalProperties: false
description: Other Persona objects related to the report
properties:
  inquiry:
    type: object
    additionalProperties: false
    description: The inquiry linked to the report
    properties:
      data:
        type:
          - object
          - 'null'
        additionalProperties: false
        properties:
          id:
            example: inq_KHK4MJCE4QvfocWB2intQ3YE
            type: string
          type:
            const: inquiry
            type: string
  account:
    type: object
    additionalProperties: false
    description: >-
      The report's home account, or the first linked account when it has no home
      account. It returns only one account and is kept for backwards
      compatibility; use `accounts` to see every associated account. Including
      it does not require the `account.read` permission.
    properties:
      data:
        type:
          - object
          - 'null'
        additionalProperties: false
        properties:
          id:
            example: act_9e3yoAUApTRMjgNoPAC7TNtz
            type: string
          type:
            const: account
            type: string
  accounts:
    type: object
    additionalProperties: false
    description: >-
      Every account associated with the report, meaning its home account plus
      all linked accounts, deduplicated and listed in account creation order.
      Use this when a report can be linked to more than one account; `account`
      is kept for backwards compatibility and returns only one. The list is not
      paginated or capped, and is empty when the report has no accounts.
      Expanding it with `include=accounts` requires the `account.read`
      permission; the linkage ids do not.
    required:
      - data
    properties:
      data:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - id
            - type
          properties:
            id:
              example: act_9e3yoAUApTRMjgNoPAC7TNtz
              type: string
            type:
              const: account
              type: string
  transaction:
    type: object
    additionalProperties: false
    description: The transaction linked to the report
    properties:
      data:
        type:
          - object
          - 'null'
        additionalProperties: false
        properties:
          id:
            example: txn_9e3yoAUApTRMjgNoPAC7TNtz
            type: string
          type:
            const: transaction
            type: string
  report-template:
    type: object
    additionalProperties: false
    description: The report template used to create this report
    properties:
      data:
        type: object
        additionalProperties: false
        properties:
          id:
            example: rptp_tQumELV14h7Vh9Qqm8Ytm5K1
            type: string
          type:
            x-polymorphic: true
            example: report-template/watchlist
            type: string
