title: mDoc Verification
description: An mDoc (mobile document) Verification
type: object
additionalProperties: false
properties:
  type:
    type: string
    const: verification/mdoc
  id:
    type: string
    description: The token of the verification
    example: ver_ABC123
  attributes:
    unevaluatedProperties: false
    allOf:
      - $ref: ./verification-shared-attributes.yaml
      - type: object
        properties:
          name-first:
            description: Given or first name.
            type:
              - string
              - 'null'
          name-last:
            description: Family or last name.
            type:
              - string
              - 'null'
          birthdate:
            description: Date of birth.
            examples:
              - '2000-01-01'
            type:
              - string
              - 'null'
          address-street:
            description: Street address of residence.
            examples:
              - 123 Main St
            type:
              - string
              - 'null'
          address-city:
            description: City of residence address.
            examples:
              - San Francisco
            type:
              - string
              - 'null'
          address-state:
            description: State or subdivision of residence address.
            examples:
              - CA
            type:
              - string
              - 'null'
          address-postal-code:
            description: ZIP or postal code of residence address.
            examples:
              - '94111'
            type:
              - string
              - 'null'
          address-country-code:
            description: ISO 3166-1 alpha 2 country code of the residence address.
            examples:
              - US
            type:
              - string
              - 'null'
          issuing-authority:
            description: The authority that issued the document.
            examples:
              - CA
            type:
              - string
              - 'null'
          issuing-jurisdiction:
            description: The jurisdiction that issued the document.
            examples:
              - CA
            type:
              - string
              - 'null'
          issuing-country:
            description: ISO 3166-1 alpha 2 country code of the issuing country.
            examples:
              - US
            type:
              - string
              - 'null'
          nationality:
            description: Nationality of the holder.
            examples:
              - US
            type:
              - string
              - 'null'
          expiration-date:
            description: The expiration date of the document.
            examples:
              - '2030-01-01'
            type:
              - string
              - 'null'
          identification-number:
            description: The document or identification number.
            examples:
              - '123456'
            type:
              - string
              - 'null'
          age-in-years:
            description: Age of the holder.
            examples:
              - 25
            type:
              - integer
              - 'null'
          meets-minimum-age:
            description: Whether the holder meets a minimum age requirement.
            examples:
              - true
              - false
            type:
              - boolean
              - 'null'
          validated-issuer-key:
            description: The trusted organization that issued the document credentials.
            examples:
              - apple_wallet
            type:
              - string
              - 'null'
          portrait-photo:
            description: The portrait photo extracted from the mobile document credential.
            properties:
              byte-size:
                default: 0
                examples:
                  - 316802
                type: integer
              url:
                examples:
                  - https://files.withpersona.com/...
                type: string
            type:
              - object
              - 'null'
  relationships:
    $ref: ./verification-shared-relationships.yaml
