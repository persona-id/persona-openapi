title: Digital ID Northern Ireland Drivers License Check Code Verification
description: A Digital ID Northern Ireland Drivers License Check Code Verification
type: object
additionalProperties: false
properties:
  type:
    type: string
    const: verification/digital-id-northern-ireland-drivers-license-check-code
  id:
    type: string
    description: The token of the verification
    example: ver_ABC123
  attributes:
    unevaluatedProperties: false
    allOf:
      - $ref: ./verification-shared-attributes.yaml
      - type: object
        properties:
          check-code:
            description: >-
              The single-use check code generated by the driver on
              nidirect.gov.uk.
            type:
              - string
              - 'null'
          license-number:
            description: >-
              The Northern Ireland driving licence number submitted for the
              check.
            type:
              - string
              - 'null'
          name-full-input:
            description: Full name provided by the end user for comparison.
            type:
              - string
              - 'null'
          name-full:
            description: Full name returned by the DVA licence check.
            type:
              - string
              - 'null'
          license-status:
            description: Driving status returned by the DVA licence check.
            type:
              - string
              - 'null'
          license-expiry-date:
            description: Date until which the driving licence is valid.
            type:
              - string
              - 'null'
            format: date
          driving-license-details:
            description: Additional licence details returned by the DVA licence check.
            type:
              - string
              - 'null'
  relationships:
    $ref: ./verification-shared-relationships.yaml
