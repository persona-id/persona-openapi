description: An invalid API key was provided.
content:
  application/json:
    examples:
      Unauthorized:
        value:
          errors:
            - title: Must be authenticated to access this endpoint
    schema:
      properties:
        errors:
          type: array
          items:
            additionalProperties: false
            properties:
              title:
                description: Unauthorized
                examples:
                  - Must be authenticated to access this endpoint
                  - Token is invalid
                  - API key belongs to an archived environment
                type: string
              details:
                type: string
                examples:
                  - >-
                    The API key used for this request belongs to an archived
                    environment. Use a key from an active environment.
      type: object
      additionalProperties: false
