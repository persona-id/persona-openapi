post:
  operationId: webhook-workflow-run-errored
  summary: Workflow run errored
  description: >-
    Webhook for the `workflow-run.errored` event. For more info see [Webhooks
    Overview](https://docs.withpersona.com/webhooks).
  tags:
    - Workflow run events
  x-persona-product: Workflows
  parameters:
    - $ref: ../components/parameters/persona-signature-header.yaml
    - $ref: ../components/parameters/persona-webhook-attempts-made.yaml
    - $ref: ../components/parameters/persona-webhook-attempts-left.yaml
    - $ref: ../components/parameters/persona-webhook-first-attempted-at.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            data:
              type: object
              unevaluatedProperties: false
              allOf:
                - $ref: ../components/schemas/webhook-body-shared-data.yaml
                - type: object
                  properties:
                    attributes:
                      unevaluatedProperties: false
                      allOf:
                        - type: object
                          properties:
                            name:
                              type: string
                              const: workflow-run.errored
                            payload:
                              type: object
                              additionalProperties: false
                              properties:
                                data:
                                  $ref: ../components/schemas/workflow-run.yaml
                                included:
                                  description: >-
                                    All objects that are present in
                                    `data.attributes.relationships` will be
                                    provided in `included`.
                                  $ref: >-
                                    ../components/schemas/workflow-run-included-objects.yaml
                            context:
                              type: object
                              description: >-
                                Additional context for the event. Describes the
                                step that caused the workflow run to error and
                                why. Being rolled out gradually: until it is
                                enabled for your organization, this is `{}`.
                              additionalProperties: true
                              properties:
                                errored-step:
                                  type:
                                    - object
                                    - 'null'
                                  description: >-
                                    The step that errored. `null` when the run
                                    failed as a whole rather than at a step (for
                                    example, it expired), or when the run
                                    errored before this field existed.
                                  additionalProperties: false
                                  properties:
                                    name:
                                      type:
                                        - string
                                        - 'null'
                                      description: >-
                                        Display name of the step in the
                                        workflow.
                                      examples:
                                        - Run report
                                    key:
                                      type:
                                        - string
                                        - 'null'
                                      description: >-
                                        Identifier of the step in the workflow
                                        version's configuration.
                                      examples:
                                        - action_run_report
                                    type:
                                      type:
                                        - string
                                        - 'null'
                                      description: >-
                                        Kind of step, for example `action`,
                                        `conditional`, `parallel`, `loop`,
                                        `module` or `wait`.
                                      examples:
                                        - action
                                    action-key:
                                      type:
                                        - string
                                        - 'null'
                                      description: >-
                                        The action the step runs. `null` unless
                                        `type` is `action`.
                                      examples:
                                        - run_report
                                error:
                                  type:
                                    - object
                                    - 'null'
                                  description: >-
                                    Why the run errored. `null` when the run
                                    errored before this field existed.
                                  additionalProperties: false
                                  properties:
                                    type:
                                      type:
                                        - string
                                        - 'null'
                                      description: >-
                                        Category of the error, for example
                                        `missing-input-error`,
                                        `invalid-input-error`,
                                        `configuration-error`, `resource-error`
                                        or `unknown-error`. `run-failure` when
                                        the run failed as a whole rather than at
                                        a step.
                                      examples:
                                        - missing-input-error
                                    message:
                                      type:
                                        - string
                                        - 'null'
                                      description: >-
                                        Human-readable description of the error.
                                        Only shown for configuration and input
                                        errors; every other type reads "An error
                                        occurred while executing this step".
                                      examples:
                                        - >-
                                          Required information is missing for
                                          report_template_id
                        - $ref: >-
                            ../components/schemas/webhook-body-shared-attributes.yaml
        examples:
          Example Body:
            $ref: ../components/examples/workflow-run-errored-webhook-body.yaml
  responses:
    '200':
      $ref: ../components/responses/success.yaml
